<svg xmlns="http://www.w3.org/2000/svg" viewBox="-120 -120 240 240">
  <defs>
    <filter id="b" width="170%" height="170%" x="-35%" y="-35%">
      <feTurbulence baseFrequency=".018" numOctaves="3" result="noise" seed="11" type="fractalNoise"/>
      <feDisplacementMap in="SourceGraphic" in2="noise" scale="18" xChannelSelector="R" yChannelSelector="G"/>
    </filter>
    <filter id="c" width="170%" height="170%" x="-35%" y="-35%">
      <feTurbulence baseFrequency=".022" numOctaves="3" result="noise" seed="22" type="fractalNoise"/>
      <feDisplacementMap in="SourceGraphic" in2="noise" scale="14" xChannelSelector="R" yChannelSelector="G"/>
    </filter>
    <filter id="a" width="190%" height="190%" x="-45%" y="-45%">
      <feGaussianBlur result="b" stdDeviation="6"/>
      <feComponentTransfer>
        <feFuncA exponent="1.25" type="gamma"/>
      </feComponentTransfer>
    </filter>
  </defs>
  <g filter="url(#a)" opacity=".45">
    <circle r="70" fill="#88b858" class="recolor-fill"/>
  </g>
  <circle r="64" fill="#7fb251" class="recolor-fill" filter="url(#b)"/>
  <circle r="44" fill="#5f8d33" class="recolor-fill" filter="url(#c)" opacity=".55"/>
  <circle r="66" fill="none" stroke="#0b0f0a" stroke-opacity=".45" stroke-width="2.2" filter="url(#c)"/>
  <g fill="#0b0f0a" opacity=".25">
    <circle cx="-18" cy="-8" r="3.2"/>
    <circle cx="8" cy="-12" r="2.6"/>
    <circle cx="16" cy="10" r="2.8"/>
    <circle cx="-6" cy="18" r="2.5"/>
  </g>
</svg>